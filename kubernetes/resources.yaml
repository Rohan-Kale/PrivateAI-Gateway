apiVersion: v1
kind: Namespace
metadata:
  name: privateai
  labels:
    app.kubernetes.io/part-of: privateai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: privateai-config
  labels:
    app.kubernetes.io/part-of: privateai
data:
  STORE_MODE: database
  DETECTOR_URL: http://detector:8001
  MAX_CONCURRENCY: '32'
  PYTHONDONTWRITEBYTECODE: '1'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: privateai-schema
  labels:
    app.kubernetes.io/part-of: privateai
data:
  001_init.sql: "CREATE TABLE IF NOT EXISTS policies (\n    tenant TEXT PRIMARY KEY\
    \ CHECK (tenant ~ '^[a-zA-Z0-9_-]{1,64}$'),\n    version BIGINT NOT NULL CHECK\
    \ (version > 0),\n    document JSONB NOT NULL,\n    updated_at TIMESTAMPTZ NOT\
    \ NULL DEFAULT now()\n);\nINSERT INTO policies(tenant, version, document) VALUES\n\
    ('demo', 1, '{\"default\":\"redact\",\"rules\":{\"SECRET\":\"block\",\"EMAIL\"\
    :\"tokenize\"},\"restore\":true,\"cache_seconds\":60}')\nON CONFLICT DO NOTHING;\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: privateai-prometheus
  labels:
    app.kubernetes.io/part-of: privateai
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nrule_files:\n- /etc/prometheus/alerts.yml\n\
    scrape_configs:\n- job_name: privateai-gateway\n  dns_sd_configs:\n  - names:\n\
    \    - gateway-metrics\n    type: A\n    port: 8080\n- job_name: privateai-worker\n\
    \  dns_sd_configs:\n  - names:\n    - worker\n    type: A\n    port: 8080\n"
  alerts.yml: "groups:\n  - name: privateai\n    rules:\n      - alert: GatewayUnavailable\n\
    \        expr: absent(up{job=\"privateai-gateway\"}) or up{job=\"privateai-gateway\"\
    } == 0\n        for: 2m\n        labels: {severity: critical}\n        annotations:\
    \ {summary: 'Gateway metrics endpoint unavailable'}\n      - alert: GatewayErrorRatioHigh\n\
    \        expr: sum(rate(privateai_errors_total[5m])) / clamp_min(sum(rate(privateai_requests_total[5m])),\
    \ 0.001) > 0.1\n        for: 5m\n        labels: {severity: warning}\n       \
    \ annotations: {summary: 'More than 10% of inference requests failed or were blocked;\
    \ inspect policy blocks separately'}\n      - alert: WorkerJobsFailing\n     \
    \   expr: sum(increase(privateai_jobs_failed_total[10m])) > 0\n        labels:\
    \ {severity: warning}\n        annotations: {summary: 'Queue jobs reached a terminal\
    \ failure'}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: worker
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: detector
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: detector
  ports:
  - name: http
    port: 8001
    targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: mock
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: mock
  ports:
  - name: http
    port: 8002
    targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: privateai-gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - secretRef:
            name: privateai-secrets
        - configMapRef:
            name: privateai-config
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: privateai-gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - secretRef:
            name: privateai-secrets
        - configMapRef:
            name: privateai-config
        args:
        - worker
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: detector
        image: privateai-python:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DETECTOR_KEY
          valueFrom:
            secretKeyRef:
              name: privateai-secrets
              key: DETECTOR_KEY
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock
  template:
    metadata:
      labels:
        app: mock
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mock
        image: privateai-python:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command:
        - python
        - -m
        - mock.provider
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8002
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: privateai-prometheus
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: postgres
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: schema
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        env:
        - name: POSTGRES_USER
          value: privateai
        - name: POSTGRES_DB
          value: privateai
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: privateai-secrets
              key: POSTGRES_PASSWORD
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - privateai
            - -d
            - privateai
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: schema
        configMap:
          name: privateai-schema
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  selector:
    app: redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: privateai-secrets
              key: REDIS_PASSWORD
        command:
        - sh
        - -c
        - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --maxmemory
          256mb --maxmemory-policy noeviction
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privateai-ingress
  labels:
    app.kubernetes.io/part-of: privateai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
