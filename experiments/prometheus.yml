global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/experiment-alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: privateai-gateway
    static_configs:
      - targets: [gateway:8080]
  - job_name: privateai-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: dependency-probes
    static_configs:
      - targets: [probe:8011]
