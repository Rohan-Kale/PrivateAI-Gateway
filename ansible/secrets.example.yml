# Copy to secrets.yml (gitignored), replace values, then ansible-vault encrypt it.
# Use a published image with a digest; build/push from the repository first.
privateai_image: registry.example.com/privateai-gateway@sha256:REPLACE_WITH_IMAGE_DIGEST
privateai_worker_env:
  STORE_MODE: database
  DATABASE_URL: postgres://USER:PASSWORD@DB_HOST:5432/privateai?sslmode=verify-full
  REDIS_URL: rediss://:PASSWORD@REDIS_HOST:6379/0
  API_KEYS: '{"REPLACE_WITH_TENANT_KEY":"demo"}'
  ADMIN_KEY: REPLACE_WITH_ADMIN_KEY
  DETECTOR_KEY: REPLACE_WITH_SERVICE_KEY
  VAULT_KEY: REPLACE_WITH_BASE64_KEY
  DETECTOR_URL: https://detector.example.com
  PROVIDER_URL: https://provider.example.com
  PROVIDER_KEY: REPLACE_WITH_PROVIDER_KEY
  MAX_CONCURRENCY: '8'
