---
- name: Install KVM and libvirt tools
  ansible.builtin.apt:
    name: [qemu-kvm, libvirt-daemon-system, libvirt-clients, virtinst]
    state: present

- name: Verify KVM acceleration is exposed by the host
  ansible.builtin.stat:
    path: /dev/kvm
  register: privateai_kvm_device

- name: Require hardware virtualization
  ansible.builtin.assert:
    that: privateai_kvm_device.stat.exists
    fail_msg: Host does not expose /dev/kvm; use a virtualization-capable host or disable the KVM role.

- name: Enable libvirt
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

- name: Validate virtualization capabilities
  ansible.builtin.command: virsh -c qemu:///system capabilities
  changed_when: false
  when: not ansible_check_mode

- name: Grant explicitly named operators access to libvirt and KVM
  ansible.builtin.user:
    name: '{{ item }}'
    groups: [libvirt, kvm]
    append: true
  loop: '{{ privateai_kvm_operators }}'
